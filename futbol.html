<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy Gol | Santiago Sarmiento</title>
    <meta name="description" content="Galaxy Gol: fútbol arcade 2D de alienígenas, 4 contra 4, hecho con JavaScript y Canvas. Juega contra Zorp, con un amigo en el mismo teclado o en línea.">
    <!-- para que se vea bonito al compartir el enlace (WhatsApp, LinkedIn, etc.) -->
    <link rel="canonical" href="https://santisarm0607.github.io/futbol.html">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Santiago Sarmiento">
    <meta property="og:locale" content="es_CO">
    <meta property="og:title" content="Galaxy Gol | Santiago Sarmiento">
    <meta property="og:description" content="Galaxy Gol: fútbol arcade 2D de alienígenas, 4 contra 4, hecho con JavaScript y Canvas. Juega contra Zorp, con un amigo en el mismo teclado o en línea.">
    <meta property="og:url" content="https://santisarm0607.github.io/futbol.html">
    <meta property="og:image" content="https://santisarm0607.github.io/img/og-portada.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Santiago Sarmiento, Ingeniero Multimedia">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="img/favicon.png" type="image/png"> <!-- tu muñequito en la pestaña -->
    <link rel="apple-touch-icon" href="img/apple-touch-icon.png"> <!-- ícono si guardan la página en el celular -->
    <link rel="stylesheet" href="css/styles.css?v=20261031">
    <script src="js/tema.js?v=20261031"></script> <!-- modo claro/oscuro guardado (va antes de dibujar) -->
    <script src="js/main.js?v=20261031" defer></script> <!-- efectos con JavaScript (ver js/main.js) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

    <header class="header">
        <div class="contenedor header__contenedor">
            <a href="index.html" class="header__logo" aria-label="Ir al inicio - Santisarm">
                <img src="img/logo-santisarm-horizontal.webp" alt="Logo de Santisarm" width="180" height="52" class="header__logo-img">
            </a>
            <nav aria-label="Menú principal">
                <ul class="nav__lista">
                    <li><a href="index.html" class="nav__enlace">Inicio</a></li>
                    <li><a href="portafolio.html" class="nav__enlace">Portafolio</a></li>
                    <li><a href="juegos.html" class="nav__enlace nav__enlace--activo">Juegos</a></li>
                    <li><a href="contacto.html" class="nav__enlace">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section class="juego" aria-labelledby="titulo-juego">
            <div class="contenedor">
                <p id="titulo-juego" class="juego__titulo">Galaxy Gol</p>
                <p class="juego__eslogan">Fútbol arcade de alienígenas, 4 contra 4. ¿Le ganas a Zorp?</p>

                <!-- El juego va en una ventana (iframe) para que sus estilos no choquen con los del portafolio.
                     El código del juego está en juegos/galaxy-gol/ (copia del repositorio santisarm0607/galaxy-gol). -->
                <div class="juego__marco">
                    <iframe class="juego__ventana" src="juegos/galaxy-gol/index.html" loading="lazy"
                            title="Juego Galaxy Gol: fútbol de alienígenas" allow="fullscreen; autoplay" allowfullscreen></iframe>
                </div>

                <!-- En el celular la ventana queda muy pequeña: se muestra esta portada y el juego se abre solo -->
                <div class="juego__portada">
                    <div class="planeta planeta--gol juego__planeta">
                        <span class="planeta__esfera" aria-hidden="true">
                            <svg class="planeta__cancha" viewBox="0 0 100 100">
                                <line x1="50" y1="0" x2="50" y2="100"></line>
                                <circle cx="50" cy="50" r="13"></circle>
                                <rect x="-2" y="32" width="18" height="36"></rect>
                                <rect x="84" y="32" width="18" height="36"></rect>
                            </svg>
                            <span class="planeta__luna planeta__luna--balon"></span>
                        </span>
                    </div>
                    <a href="juegos/galaxy-gol/index.html" class="boton boton--primario juego__jugar">▶ Jugar Galaxy Gol</a>
                    <p class="juego__pista">En el celular el juego se abre en su propia pantalla, con joystick y botones táctiles.</p>
                </div>


                <div class="juego__botones">
                    <a href="juegos.html" class="boton boton--primario">Volver a la nave</a>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="contenedor footer__contenedor"></div>
    </footer>

</body>
</html>
